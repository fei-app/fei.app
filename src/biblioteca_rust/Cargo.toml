[package]
name = "openfei_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "openfei_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "cookies",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
regex = "1"
chrono = "0.4"
chrono-tz = "0.10"
url = "2"
thiserror = "1"